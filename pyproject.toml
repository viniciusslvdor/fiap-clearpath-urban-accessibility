[project]
name = "clearpath"
version = "1.0.0"
description = "ClearPath: accessibility barriers, reported and resolved (FIAP Global Solution 2026.2 POC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "scikit-learn==1.9.1",
    "numpy>=2.5",
    "pandas>=3.1",
    "opencv-python-headless>=5.1",
    "matplotlib>=3.11",
    "paho-mqtt>=2.2",
    "joblib>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16.2",
    "jupyter>=1.1",
    "nbconvert>=7.17",
    "markdown>=3.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/backend/tests"]

[tool.pyright]
extraPaths = ["src/backend", "src/backend/scripts"]
typeCheckingMode = "off"
